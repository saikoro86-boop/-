<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>テニスコート空き検索</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f24; --sub:#6a7280; --accent:#1f8a4c; --line:#e3e6ea; --chip:#e9f5ee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171a; --card:#1d2126; --text:#eceff3; --sub:#9aa3af; --accent:#4cc27f; --line:#2c3238; --chip:#1f3a2b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system,"Hiragino Sans",sans-serif; }
  header { padding:16px; }
  h1 { margin:0; font-size:20px; }
  #updated { color:var(--sub); font-size:12px; }
  .bar { position:sticky; top:0; background:var(--bg); padding:8px 16px; border-bottom:1px solid var(--line); z-index:2; }
  .row { display:flex; gap:8px; overflow-x:auto; padding:4px 0; scrollbar-width:none; }
  .row::-webkit-scrollbar { display:none; }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:999px; padding:6px 14px; white-space:nowrap; cursor:pointer; }
  button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .day { display:flex; flex-direction:column; align-items:center; min-width:54px; border-radius:12px; padding:6px 8px; line-height:1.25; }
  .day small { font-size:11px; opacity:.8; }
  .day b { font-size:12px; margin-top:2px; }
  .sat small { color:#3b82f6; } .sun small { color:#ef4444; }
  .day[aria-pressed="true"] small { color:#fff; }
  main { padding:12px 16px 40px; display:grid; gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
  .card h2 { margin:0 0 2px; font-size:16px; }
  .city { color:var(--sub); font-size:12px; }
  .court { display:flex; justify-content:space-between; gap:8px; padding:8px 0; border-top:1px solid var(--line); }
  .court:first-of-type { border-top:0; }
  .court > span:first-child { flex:1 1 40%; }
  .times { flex:1 1 60%; display:flex; flex-wrap:wrap; gap:4px; justify-content:flex-end; }
  .t { background:var(--chip); color:var(--accent); border-radius:6px; padding:1px 8px; font-size:13px; font-weight:600; }
  .btn { display:inline-block; margin-top:10px; padding:8px 16px; border-radius:999px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; }
  .card.link .city + h2 + .city { margin:2px 0 0; }
  .empty, .err { text-align:center; color:var(--sub); padding:32px 0; }
  .err { color:#c0392b; font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>🎾 テニスコート空き検索</h1>
  <div id="updated">読み込み中…</div>
</header>
<div class="bar">
  <div class="row" id="days"></div>
  <div class="row" id="cities"></div>
  <div class="row" id="zones"></div>
</div>
<main id="list"></main>
<script>
const $ = (id) => document.getElementById(id);
const WD = ["日","月","火","水","木","金","土"];
const ZONES = { "all":["すべて",0,24], "am":["午前",0,12], "pm":["午後",12,17], "ev":["夜",17,24] };
const st = { date:null, city:"all", zone:"all" };
let data = { slots:[], sites:[], links:[], errors:[] };
let imported = null; // ユーザーが自分のブラウザで取り込んだ空き(この端末だけに保存)
const IMPORT_KEY = "courtImport";
const STALE_MS = 24 * 3600e3;

// 取り込みデータの検証。#hash は誰でも書き換えられるので、型と範囲を確かめてから使う
function validateImport(x) {
  if (!x || x.source !== "import" || !Array.isArray(x.slots) || x.slots.length > 5000) return null;
  const slots = [];
  for (const s of x.slots) {
    if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s.date) || typeof s.site !== "string" || typeof s.facility !== "string" || typeof s.court !== "string") continue;
    if (!(s.start >= 0 && s.end <= 30 && s.start < s.end)) continue;
    slots.push({ date:s.date, site:s.site.slice(0, 30), facility:s.facility.slice(0, 60), court:s.court.slice(0, 60), start:+s.start, end:+s.end });
  }
  const t = Date.parse(x.importedAt);
  return slots.length && !isNaN(t) ? { source:"import", importedAt:new Date(t).toISOString(), slots } : null;
}
function loadImport() {
  // ブックマークレットが #import=<base64> で渡してくる
  const m = location.hash.match(/^#import=([A-Za-z0-9+/=_-]+)$/);
  if (m) {
    try {
      const imp = validateImport(JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,"+").replace(/_/g,"/"))))));
      if (imp) localStorage.setItem(IMPORT_KEY, JSON.stringify(imp));
    } catch {}
    history.replaceState(null, "", location.pathname + location.search); // URL からデータを消す
  }
  try { return validateImport(JSON.parse(localStorage.getItem(IMPORT_KEY) || "null")); } catch { return null; }
}

const hm = (h) => { const m = Math.round((h % 1) * 60); return Math.floor(h) + (m ? ":" + String(m).padStart(2,"0") : ""); };

function chips(el, items, key) {
  el.innerHTML = "";
  for (const [v, label] of items) {
    const b = document.createElement("button");
    b.textContent = label; b.setAttribute("aria-pressed", st[key] === v);
    b.onclick = () => { st[key] = v; render(); };
    el.appendChild(b);
  }
}

function render() {
  // 日付ストリップ(空きがある日にマーク)
  const dates = [...new Set(data.slots.map(s => s.date))].sort();
  if (!st.date || !dates.includes(st.date)) st.date = dates[0] || null;
  $("days").innerHTML = "";
  for (const d of dates) {
    // 端末のタイムゾーンに左右されないよう、日付文字列から直接作る
    const [yy, mm, dd] = d.split("-").map(Number);
    const dt = new Date(Date.UTC(yy, mm - 1, dd)), w = dt.getUTCDay();
    const b = document.createElement("button");
    b.className = "day " + (w === 6 ? "sat" : w === 0 ? "sun" : "");
    b.innerHTML = `<small>${WD[w]}</small><b>${dt.getUTCMonth()+1}/${dt.getUTCDate()}</b>`;
    b.setAttribute("aria-pressed", st.date === d);
    b.onclick = () => { st.date = d; render(); };
    $("days").appendChild(b);
  }
  chips($("cities"), [["all","全エリア"], ...data.sites.map(s => [s, s])], "city");
  chips($("zones"), Object.entries(ZONES).map(([k, v]) => [k, v[0]]), "zone");

  const [, z0, z1] = ZONES[st.zone];
  const hits = data.slots.filter(s => s.date === st.date && (st.city === "all" || s.site === st.city) && s.start < z1 && s.end > z0);
  const byFac = new Map();
  for (const s of hits) {
    const k = s.site + "|" + s.facility;
    if (!byFac.has(k)) byFac.set(k, { site:s.site, facility:s.facility, courts:new Map() });
    const c = byFac.get(k).courts;
    if (!c.has(s.court)) c.set(s.court, []);
    c.get(s.court).push(s);
  }
  const list = $("list");
  list.innerHTML = "";
  if (!byFac.size) list.innerHTML = '<div class="empty">この条件で空いているコートはありません</div>';
  for (const f of byFac.values()) {
    const card = document.createElement("section");
    card.className = "card";
    card.innerHTML = `<div class="city">${f.site}</div><h2></h2>`;
    card.querySelector("h2").textContent = f.facility;
    for (const [court, ss] of f.courts) {
      const row = document.createElement("div");
      row.className = "court";
      const name = document.createElement("span"); name.textContent = court;
      const times = document.createElement("span"); times.className = "times";
      // 連続する枠(9-10, 10-11 …)は 1 つにまとめる
      const merged = [];
      for (const s of ss.sort((a, b) => a.start - b.start)) {
        const last = merged[merged.length - 1];
        if (last && s.start <= last.end) last.end = Math.max(last.end, s.end);
        else merged.push({ start: s.start, end: s.end });
      }
      for (const s of merged) {
        const t = document.createElement("span"); t.className = "t"; t.textContent = `${hm(s.start)}–${hm(s.end)}`; times.appendChild(t);
      }
      row.append(name, times); card.appendChild(row);
    }
    list.appendChild(card);
  }
  // 自動取得できない地域は、公式サイトへのリンクを出す
  for (const l of (data.links || [])) {
    if (st.city !== "all" && st.city !== l.name) continue;
    const card = document.createElement("section");
    card.className = "card link";
    const head = document.createElement("div"); head.className = "city"; head.textContent = l.name + "(自動取得なし)";
    const h2 = document.createElement("h2"); h2.textContent = "公式サイトで空きを確認";
    card.append(head, h2);
    if (l.facilities && l.facilities.length) {
      const p = document.createElement("div"); p.className = "city";
      p.textContent = l.facilities.map(f => f.name + (f.hint ? "(" + f.hint + ")" : "")).join(" / ");
      card.appendChild(p);
    }
    const a = document.createElement("a");
    a.href = l.entryUrl; a.target = "_blank"; a.rel = "noopener noreferrer"; a.className = "btn";
    a.textContent = "予約サイトを開く ↗";
    card.appendChild(a);
    if (imported && imported.slots.some(s => s.site === l.name)) {
      const t = new Date(imported.importedAt);
      const stale = Date.now() - t.getTime() > STALE_MS;
      const n = document.createElement("div");
      n.className = "city";
      n.textContent = `この端末で取り込み済み: ${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}` + (stale ? "(古い可能性があります)" : "");
      card.appendChild(n);
    }
    list.appendChild(card);
  }
  if (data.errors.length) {
    const e = document.createElement("div"); e.className = "err";
    e.textContent = `取得に失敗した日があります(${data.errors.length}件)。空き表示が不完全な可能性があります。`;
    list.appendChild(e);
  }
}

// アプリを開いたまま取り込みが来た場合(ハッシュだけが変わる)も読み直す
window.addEventListener("hashchange", () => { if (/^#import=/.test(location.hash)) location.reload(); });

fetch("data.json", { cache:"no-cache" }).then(r => r.json()).then(d => {
  data = d;
  data.links = data.links || [];
  imported = loadImport();
  if (imported) {
    const today = new Date(Date.now() + 9*3600e3).toISOString().slice(0, 10);
    data.slots = data.slots.concat(imported.slots.filter(s => s.date >= today));
    for (const s of imported.slots) if (!data.sites.includes(s.site)) data.sites.push(s.site);
  }
  const t = new Date(d.updatedAt);
  $("updated").textContent = `最終更新 ${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}`;
  render();
}).catch(() => { $("updated").textContent = "データを読み込めませんでした"; });
</script>
</body>
</html>
