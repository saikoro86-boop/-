name: テニスコート空き状況の更新

# 取得プログラム(このリポジトリ・非公開)で画面とデータを作り、
# 画面と data.json だけを、公開用の別リポジトリ(vars.SITE_REPO)に書き出す。
#
# 事前設定(Settings → Secrets and variables → Actions):
#   Variables: SITE_REPO        公開用リポジトリ名(例: tc-xxxxxxxx。owner は付けない)
#   Secrets:   SITE_REPO_TOKEN  公開用リポジトリだけに Contents 書き込みできるトークン

on:
  schedule:
    - cron: "17 */3 * * *"   # 3時間ごと
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: courts
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 設定を確認
        env:
          SITE_REPO: ${{ vars.SITE_REPO }}
          TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: |
          if [ -z "$SITE_REPO" ] || [ -z "$TOKEN" ]; then
            echo "::error::Variables の SITE_REPO と Secrets の SITE_REPO_TOKEN を設定してください"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: 空き状況を取得
        run: npm run courts:build

      - name: 取り込み用ブックマークレットを生成(公開URL向け)
        run: npm run bookmarklet
        env:
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ vars.SITE_REPO }}/

      - name: 手動更新ボタンの設定(任意)
        env:
          REFRESH_URL: ${{ vars.REFRESH_URL }}
        run: |
          # 中継役のURLが設定されているときだけ、画面に「取得し直す」ボタンが出る
          if [ -n "$REFRESH_URL" ]; then printf '{"url":"%s"}' "$REFRESH_URL" > public/refresh-config.json; fi

      - name: 画面とデータだけを書き出す
        env:
          OWNER: ${{ github.repository_owner }}
          SITE_REPO: ${{ vars.SITE_REPO }}
          TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: |
          # 公開用リポジトリを取得せず、毎回「新しい1コミット」を作って置き換える
          # (空のリポジトリでも動く。データの変更履歴は不要)
          mkdir site && cd site
          git init -q -b publish
          cp ../public/index.html ../public/bookmarklet.html ../public/data.json ../public/data2.json .
          cp ../public/manifest.webmanifest ../public/sw.js .
          cp -r ../public/icons .
          cp ../public/refresh-config.json . 2>/dev/null || true
          touch .nojekyll
          git config user.name  "courts-bot"
          git config user.email "courts-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "update $(date -u +%Y-%m-%dT%H:%MZ)"
          AUTH="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git -c "http.extraheader=Authorization: Basic $AUTH" \
            push --force "https://github.com/$OWNER/$SITE_REPO.git" publish:main
