name: テニスコート空き状況の更新

# 取得プログラム(このリポジトリ・非公開)で画面とデータを作り、
# 画面と data.json だけを、公開用の別リポジトリ(vars.SITE_REPO)に書き出す。
#
# 事前設定(Settings → Secrets and variables → Actions):
#   Variables: SITE_REPO        公開用リポジトリ名(例: tc-xxxxxxxx。owner は付けない)
#   Secrets:   SITE_REPO_TOKEN  公開用リポジトリだけに Contents 書き込みできるトークン

on:
  schedule:
    - cron: "17 */3 * * *"   # 3時間ごと
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: courts
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 設定を確認
        env:
          SITE_REPO: ${{ vars.SITE_REPO }}
          TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: |
          if [ -z "$SITE_REPO" ] || [ -z "$TOKEN" ]; then
            echo "::error::Variables の SITE_REPO と Secrets の SITE_REPO_TOKEN を設定してください"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: 空き状況を取得
        run: npm run courts:build

      - name: 取り込み用ブックマークレットを生成(公開URL向け)
        run: npm run bookmarklet
        env:
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ vars.SITE_REPO }}/

      - name: 公開用リポジトリを取得
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ vars.SITE_REPO }}
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: site

      - name: 画面とデータだけを書き出す
        run: |
          cd site
          # 履歴を残さず、毎回 1 コミットに置き換える(データの変更履歴は不要)
          git checkout --orphan publish
          git rm -rf . >/dev/null 2>&1 || true
          cp ../public/index.html ../public/bookmarklet.html ../public/data.json .
          touch .nojekyll
          git config user.name  "courts-bot"
          git config user.email "courts-bot@users.noreply.github.com"
          git add -A
          git commit -m "update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin publish:main
